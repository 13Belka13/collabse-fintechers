[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.31"
optimizer = true
optimizer_runs = 200
ignored_warnings_from = ["lib"]
ignored_error_codes = [2424, 4591]  # forge-std v1.11 uses the deprecated memory-safe-assembly natspec on solc 0.8.31
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
